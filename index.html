<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFA Algorithm Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Aesthetic Algorithm Visualizer</h1>
        <div class="controls">
            <button onclick="generateNewArray()">Generate New Array</button>
            <button onclick="startBubbleSort()" class="sort-btn">Bubble Sort</button>
            <button onclick="startSelectionSort()" class="sort-btn">Selection Sort</button>
        </div>
    </header>

    <main>
        <div id="array-container"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
